<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贡圈问卷 - 黑金红主题</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: #080606;
      color: #f0e6d0;
      min-height: 100vh;
      padding: 24px 16px 80px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* 页面主背景感 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse 80% 55% at 50% 28%,
        rgba(90, 20, 25, 0.55) 0%,
        rgba(35, 8, 10, 0.85) 40%,
        rgba(8, 3, 3, 1) 100%
      );
      z-index: -1;
      pointer-events: none;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #e8c040;
      text-shadow: 0 0 18px rgba(232, 192, 64, 0.45);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #9a8060;
      margin-bottom: 28px;
    }

    /* 顶部进度栏 */
    .topbar {
      width: 100%;
      max-width: 640px;
      margin: 0 auto 24px;
      height: 48px;
      background: linear-gradient(180deg,
        rgba(28, 12, 12, 0.97) 0%,
        rgba(16, 6, 6, 0.99) 50%,
        rgba(10, 4, 4, 1) 100%
      );
      border-radius: 6px;
      border: 1px solid rgba(100, 30, 30, 0.55);
      box-shadow:
        inset 0 1px 0 rgba(160, 50, 50, 0.12),
        0 2px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .progress-text {
      font-size: 14px;
      color: #e8d090;
      font-weight: 500;
    }

    .progress-bar-wrap {
      flex: 1;
      height: 8px;
      background: rgba(40, 20, 15, 0.8);
      border-radius: 4px;
      margin: 0 16px;
      overflow: hidden;
      border: 1px solid rgba(201, 162, 39, 0.25);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b1a1a, #c41e3a, #e05070);
      box-shadow: 0 0 10px rgba(196, 30, 58, 0.6);
      transition: width 0.35s ease;
      border-radius: 4px;
    }

    /* 主面板 */
    .panel {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      border-radius: 8px;
      background: linear-gradient(160deg,
        rgba(32, 12, 12, 0.96) 0%,
        rgba(18, 6, 6, 0.98) 40%,
        rgba(10, 4, 4, 1) 100%
      );
      border: 1px solid rgba(110, 30, 30, 0.5);
      box-shadow:
        inset 0 1px 0 rgba(160, 50, 50, 0.1),
        0 4px 18px rgba(0, 0, 0, 0.4);
      padding: 28px 24px 32px;
      position: relative;
    }

    /* 分隔线 */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 360px;
      height: 20px;
      margin: 0 auto 22px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        #8b1a1a 15%,
        #c41e3a 50%,
        #8b1a1a 85%,
        transparent 100%
      );
      box-shadow: 0 0 8px rgba(196, 30, 58, 0.55);
    }

    .divider-diamond {
      width: 14px;
      height: 14px;
      margin: 0 8px;
      background: linear-gradient(135deg, #e8c040, #c9a227);
      transform: rotate(45deg);
      box-shadow:
        0 0 12px rgba(201, 162, 39, 0.75),
        inset 0 0 4px rgba(255, 230, 150, 0.45);
      border: 1px solid #f5d060;
      position: relative;
    }

    .divider-diamond::before {
      content: '';
      position: absolute;
      inset: 3px;
      background: linear-gradient(135deg, #f5d060, #c9a227);
      box-shadow: inset 0 0 3px rgba(255, 255, 200, 0.35);
    }

    /* 题目 */
    .q-num {
      font-size: 13px;
      color: #c9a84c;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .q-title {
      font-size: 17px;
      font-weight: 500;
      color: #f0e6d0;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .q-title .highlight-quote {
      color: #e05070;
      text-shadow: 0 0 14px rgba(224, 80, 112, 0.45);
    }

    .q-title .highlight-name {
      color: #e8c040;
      font-weight: 500;
      text-shadow: 0 0 12px rgba(232, 192, 64, 0.4);
    }

    /* 题目图片 */
    .q-img-wrap {
      text-align: center;
      margin-bottom: 20px;
    }

    .q-img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 6px;
      border: 1px solid rgba(201, 162, 39, 0.4);
      box-shadow: 0 0 16px rgba(201, 162, 39, 0.25);
    }

    /* 选项按钮 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .opt-btn {
      width: 100%;
      min-height: 44px;
      padding: 12px 18px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.15),
        inset 0 1px 0 rgba(255, 220, 120, 0.06);
      text-align: left;
      font-family: inherit;
      position: relative;
    }

    .opt-btn:hover {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 16px rgba(201, 162, 39, 0.5),
        0 0 0 1px rgba(240, 192, 64, 0.3),
        inset 0 1px 0 rgba(255, 230, 140, 0.15);
    }

    .opt-btn.selected {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 16px rgba(201, 162, 39, 0.5),
        0 0 0 1px rgba(240, 192, 64, 0.3),
        inset 0 1px 0 rgba(255, 230, 140, 0.15);
    }

    .opt-btn.correct {
      border-color: #4caf50;
      box-shadow: 0 0 14px rgba(76, 175, 80, 0.45);
    }

    .opt-btn.wrong {
      border-color: #c41e3a;
      box-shadow: 0 0 14px rgba(196, 30, 58, 0.45);
      opacity: 0.75;
    }

    /* 图片选项（特殊题） */
    .img-options {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .img-opt {
      width: 140px;
      height: 140px;
      border-radius: 6px;
      border: 1.5px solid #c9a227;
      background: linear-gradient(180deg, #241c12 0%, #14100a 100%);
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.18),
        inset 0 1px 0 rgba(255, 220, 120, 0.08);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
      position: relative;
    }

    .img-opt img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-opt:hover {
      border-color: #f0c040;
      box-shadow:
        0 0 18px rgba(201, 162, 39, 0.55),
        0 0 0 1px rgba(240, 192, 64, 0.35);
      transform: translateY(-2px);
    }

    /* 支付相关特殊展示 */
    .pay-imgs {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pay-img {
      max-width: 180px;
      border-radius: 6px;
      border: 1px solid rgba(201, 162, 39, 0.45);
      box-shadow: 0 0 12px rgba(201, 162, 39, 0.3);
    }

    /* 导航按钮 */
    .nav-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .lang-btn, .game-btn {
      min-width: 100px;
      height: 40px;
      padding: 0 20px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.18),
        inset 0 1px 0 rgba(255, 220, 120, 0.08);
      font-family: inherit;
    }

    .lang-btn:hover,
    .lang-btn.active,
    .game-btn:hover,
    .game-btn.selected {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 14px rgba(201, 162, 39, 0.45),
        0 0 0 1px rgba(240, 192, 64, 0.35),
        inset 0 1px 0 rgba(255, 230, 140, 0.18);
    }

    .game-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* 结果页 */
    .result-panel {
      text-align: center;
      padding: 20px 10px;
    }

    .result-score {
      font-size: 42px;
      font-weight: 700;
      color: #e8c040;
      text-shadow: 0 0 20px rgba(232, 192, 64, 0.5);
      margin: 12px 0 8px;
    }

    .result-msg {
      font-size: 16px;
      color: #e05070;
      text-shadow: 0 0 12px rgba(224, 80, 112, 0.4);
      margin-bottom: 24px;
    }

    .hint {
      font-size: 12px;
      color: #706050;
      margin-top: 10px;
      text-align: center;
    }

    /* 开始页 */
    .start-panel {
      text-align: center;
      padding: 30px 10px;
    }

    .start-panel p {
      color: #c9a84c;
      margin-bottom: 28px;
      font-size: 15px;
    }

    /* 隐藏 */
    .hidden {
      display: none !important;
    }

    /* 移动端适配 */
    @media (max-width: 520px) {
      .panel { padding: 20px 14px 26px; }
      .q-title { font-size: 15px; }
      .opt-btn { font-size: 14px; padding: 10px 14px; }
      .img-opt { width: 110px; height: 110px; }
      .pay-img { max-width: 140px; }
    }
  </style>
</head>
<body>
  <!-- 顶部进度 -->
  <div class="topbar" id="topbar">
    <span class="progress-text" id="progressText">准备开始</span>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <span class="progress-text" id="scoreText">0 / 38</span>
  </div>

  <!-- 主面板 -->
  <div class="panel" id="mainPanel">
    <!-- 开始页 -->
    <div id="startPage" class="start-panel">
      <h1>贡圈问卷挑战</h1>
      <div class="divider">
        <div class="divider-diamond"></div>
      </div>
      <p>共 38 题 · 黑金红主题 · 点击开始答题</p>
      <button class="game-btn selected" id="startBtn" style="min-width:140px;height:46px;font-size:16px;">开始答题</button>
      <p class="hint" style="margin-top:20px;">题目与选项已随机生成，部分题目含图片与特殊交互</p>
    </div>

    <!-- 答题页 -->
    <div id="quizPage" class="hidden">
      <div class="divider">
        <div class="divider-diamond"></div>
      </div>
      <div class="q-num" id="qNum">第 1 题 / 共 38 题</div>
      <div class="q-title" id="qTitle"></div>
      <div class="q-img-wrap hidden" id="qImgWrap">
        <img class="q-img" id="qImg" alt="题目图片" />
      </div>
      <div class="pay-imgs hidden" id="payImgs"></div>
      <div class="options" id="options"></div>
      <div class="img-options hidden" id="imgOptions"></div>
      <div class="nav-btns">
        <button class="lang-btn" id="prevBtn">上一题</button>
        <button class="game-btn selected" id="nextBtn">下一题</button>
      </div>
      <p class="hint" id="hintText">请选择一个选项后进入下一题</p>
    </div>

    <!-- 结果页 -->
    <div id="resultPage" class="hidden result-panel">
      <h1>答题完成</h1>
      <div class="divider">
        <div class="divider-diamond"></div>
      </div>
      <div class="result-score" id="finalScore">0</div>
      <div class="result-msg" id="resultMsg">「终于来了，我的苦工预备役。」</div>
      <div class="highlight-name" style="margin-bottom:24px;display:block;">可喵大人</div>
      <button class="game-btn selected" id="restartBtn" style="min-width:140px;">重新开始</button>
    </div>
  </div>

  <script>
    // ========== 图片映射 ==========
    const IMG_MAP = {
      1:  "https://files.catbox.moe/st9jne.png",
      2:  "https://files.catbox.moe/np4dg5.png",
      3:  "https://files.catbox.moe/o61klq.png",
      4:  "https://files.catbox.moe/cnt35z.png",
      5:  "https://files.catbox.moe/rcja5k.png",
      6:  "https://files.catbox.moe/mypkk4.png",
      7:  "https://files.catbox.moe/yl0s8w.png",
      8:  "https://files.catbox.moe/olufyx.png",
      9:  "https://files.catbox.moe/87q68t.png",
      11: "https://files.catbox.moe/y6wlue.png",
      12: "https://files.catbox.moe/rz4q0s.png",
      13: "https://files.catbox.moe/13kl7s.png",
      14: "https://files.catbox.moe/12airl.png",
      15: "https://files.catbox.moe/l206nw.png",
      16: "https://files.catbox.moe/pz0cu8.png",
      17: "https://files.catbox.moe/rlxd23.png",
      18: "https://files.catbox.moe/ki6wgw.png",
      19: "https://files.catbox.moe/c5r6j3.png",
      22: "https://files.catbox.moe/c5mt5j.png",
      23: "https://files.catbox.moe/cog4fc.png",
      26: "https://files.catbox.moe/ytzbk2.png",
      27: "https://files.catbox.moe/xxqd38.png",
      28: "https://files.catbox.moe/19p7cm.png",
      30: "https://files.catbox.moe/a9ws2q.jpg",
      31: "https://files.catbox.moe/zmyaoz.png",
      32: "https://files.catbox.moe/63llpb.png",
      33: "https://files.catbox.moe/4kqulg.png",
      35: "https://files.catbox.moe/6aka04.png",
      36: "https://files.catbox.moe/mxv0t4.png",
      37: "https://files.catbox.moe/jf4jwe.png",
      38: "https://files.catbox.moe/065c2i.png"
    };

    const VX_IMG  = "https://i.postimg.cc/ht4YLyP8/IMG-20260721-005339.png";
    const ZFB_IMG = "https://i.postimg.cc/SNh3sQBR/IMG-20260721-005325.jpg";
    const SPECIAL_IMG = "https://files.catbox.moe/d5xzfs.png"; // 21 / 25 / 29

    // ========== 随机题库（38题） ==========
    // 普通选择题模板池
    const titlePool = [
      "图中角色最可能在说什么？",
      "根据图片判断，这属于哪种风格？",
      "你觉得画面中的人物心情如何？",
      "这张图最想表达的是？",
      "如果给这张图起个名字，你会选？",
      "画面中最显眼的元素是？",
      "这张图的整体氛围偏向？",
      "你认为图中人物的身份更接近？",
      "这幅图最可能出现在什么场景？",
      "从色调来看，这张图属于？",
      "图中角色的性格更偏向？",
      "这张图给你的第一印象是？",
      "如果这是一个故事的开头，接下来会？",
      "画面中的光影效果主要突出？",
      "你觉得这张图的画风最接近？",
      "图中人物正在做什么？",
      "这张图最适合配什么BGM？",
      "从构图来看，作者想强调？",
      "这张图的情绪基调是？",
      "你更愿意用哪个词形容它？"
    ];

    const optPool = [
      ["冷静观察", "热血沸腾", "略带忧郁", "玩世不恭"],
      ["赛博朋克", "和风古韵", "暗黑哥特", "清新日常"],
      ["期待", "疲惫", "坚定", "迷茫"],
      ["告别过去", "迎接未来", "陷入回忆", "寻找真相"],
      ["夜色低语", "金色黎明", "血色契约", "静谧花园"],
      ["人物眼神", "背景光效", "服饰细节", "道具特写"],
      ["神秘压抑", "轻松愉快", "庄严肃穆", "荒诞幽默"],
      ["冒险者", "贵族", "商人", "隐士"],
      ["游戏开场", "小说插图", "宣传海报", "角色立绘"],
      ["暖色系", "冷色系", "高对比", "低饱和"],
      ["外柔内刚", "外刚内柔", "直来直去", "心思细腻"],
      ["震撼", "治愈", "紧张", "怀旧"],
      ["冲突爆发", "温馨日常", "真相揭露", "旅程开启"],
      ["主体人物", "环境氛围", "情感张力", "叙事线索"],
      ["二次元厚涂", "扁平插画", "写实油画", "像素风格"],
      ["沉思", "战斗", "休息", "等待"],
      ["史诗管弦", "轻快电子", "空灵人声", "沉重鼓点"],
      ["对称平衡", "动态斜线", "留白意境", "密集细节"],
      ["希望", "绝望", "平静", "躁动"],
      ["华丽", "克制", "狂野", "精致"]
    ];

    // 特殊题标题
    const specialTitles = {
      10: "请选择你更倾向的支付方式（仅展示）",
      20: "以下支付码中，你更熟悉哪一种？",
      24: "如果需要支持作者，你会选择？",
      34: "最后确认一下支付偏好（仅展示）",
      21: "点击任意图片继续（三选一外观）",
      25: "点击任意图片继续（二选一外观）",
      29: "点击图片进入下一题"
    };

    // 生成38题
    function buildQuestions() {
      const qs = [];
      for (let i = 1; i <= 38; i++) {
        const q = {
          id: i,
          title: "",
          options: [],
          type: "choice", // choice | pay | imgClick
          img: IMG_MAP[i] || null,
          correctIndex: Math.floor(Math.random() * 4)
        };

        // 特殊题处理
        if ([10, 20, 24, 34].includes(i)) {
          q.type = "pay";
          q.title = specialTitles[i];
          q.options = ["微信", "支付宝", "都支持", "暂不需要"];
          q.correctIndex = 0;
        } else if (i === 21) {
          q.type = "imgClick";
          q.title = specialTitles[21];
          q.options = [SPECIAL_IMG, SPECIAL_IMG, SPECIAL_IMG];
          q.correctIndex = 0;
        } else if (i === 25) {
          q.type = "imgClick";
          q.title = specialTitles[25];
          q.options = [SPECIAL_IMG, SPECIAL_IMG];
          q.correctIndex = 0;
        } else if (i === 29) {
          q.type = "imgClick";
          q.title = specialTitles[29];
          q.options = [SPECIAL_IMG];
          q.correctIndex = 0;
        } else {
          // 普通随机题
          const tIdx = Math.floor(Math.random() * titlePool.length);
          const oIdx = Math.floor(Math.random() * optPool.length);
          q.title = titlePool[tIdx];
          q.options = [...optPool[oIdx]];
          // 打乱选项顺序
          for (let j = q.options.length - 1; j > 0; j--) {
            const k = Math.floor(Math.random() * (j + 1));
            [q.options[j], q.options[k]] = [q.options[k], q.options[j]];
          }
          q.correctIndex = Math.floor(Math.random() * q.options.length);
        }
        qs.push(q);
      }
      return qs;
    }

    const questions = buildQuestions();
    let current = 0;
    let answers = new Array(38).fill(null); // 记录用户选择的索引
    let score = 0;

    // DOM
    const startPage   = document.getElementById("startPage");
    const quizPage    = document.getElementById("quizPage");
    const resultPage  = document.getElementById("resultPage");
    const startBtn    = document.getElementById("startBtn");
    const prevBtn     = document.getElementById("prevBtn");
    const nextBtn     = document.getElementById("nextBtn");
    const restartBtn  = document.getElementById("restartBtn");
    const qNum        = document.getElementById("qNum");
    const qTitle      = document.getElementById("qTitle");
    const qImgWrap    = document.getElementById("qImgWrap");
    const qImg        = document.getElementById("qImg");
    const payImgs     = document.getElementById("payImgs");
    const optionsEl   = document.getElementById("options");
    const imgOptions  = document.getElementById("imgOptions");
    const progressBar = document.getElementById("progressBar");
    const progressText= document.getElementById("progressText");
    const scoreText   = document.getElementById("scoreText");
    const hintText    = document.getElementById("hintText");
    const finalScore  = document.getElementById("finalScore");
    const resultMsg   = document.getElementById("resultMsg");

    function updateProgress() {
      const pct = ((current) / 38) * 100;
      progressBar.style.width = pct + "%";
      progressText.textContent = `第 ${current + 1} 题`;
      scoreText.textContent = `${score} / 38`;
    }

    function renderQuestion() {
      const q = questions[current];
      qNum.textContent = `第 ${current + 1} 题 / 共 38 题`;
      qTitle.innerHTML = q.title;

      // 重置区域
      qImgWrap.classList.add("hidden");
      payImgs.classList.add("hidden");
      payImgs.innerHTML = "";
      optionsEl.innerHTML = "";
      optionsEl.classList.remove("hidden");
      imgOptions.classList.add("hidden");
      imgOptions.innerHTML = "";

      // 题目图片
      if (q.img && q.type === "choice") {
        qImg.src = q.img;
        qImgWrap.classList.remove("hidden");
      }

      if (q.type === "pay") {
        // 展示微信 + 支付宝图
        payImgs.innerHTML = `
          <img class="pay-img" src="${VX_IMG}" alt="微信" />
          <img class="pay-img" src="${ZFB_IMG}" alt="支付宝" />
        `;
        payImgs.classList.remove("hidden");
        hintText.textContent = "仅展示支付码，选择后可进入下一题";
        q.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className = "opt-btn" + (answers[current] === idx ? " selected" : "");
          btn.textContent = opt;
          btn.onclick = () => selectOption(idx);
          optionsEl.appendChild(btn);
        });
      } else if (q.type === "imgClick") {
        optionsEl.classList.add("hidden");
        imgOptions.classList.remove("hidden");
        hintText.textContent = "点击任意图片即可进入下一题";
        q.options.forEach((src, idx) => {
          const div = document.createElement("div");
          div.className = "img-opt";
          div.innerHTML = `<img src="${src}" alt="选项${idx+1}" />`;
          div.onclick = () => {
            answers[current] = idx;
            // 直接进入下一题
            goNext(true);
          };
          imgOptions.appendChild(div);
        });
      } else {
        // 普通选择题
        hintText.textContent = "请选择一个选项后进入下一题";
        q.options.forEach((opt, idx) => {
          const btn = document.createElement("button");
          btn.className = "opt-btn" + (answers[current] === idx ? " selected" : "");
          btn.textContent = opt;
          btn.onclick = () => selectOption(idx);
          optionsEl.appendChild(btn);
        });
      }

      // 导航按钮状态
      prevBtn.disabled = current === 0;
      nextBtn.textContent = current === 37 ? "提交答卷" : "下一题";
      updateProgress();
    }

    function selectOption(idx) {
      answers[current] = idx;
      // 更新选中样式
      const btns = optionsEl.querySelectorAll(".opt-btn");
      btns.forEach((b, i) => {
        b.classList.toggle("selected", i === idx);
      });
    }

    function goNext(force = false) {
      const q = questions[current];
      // 图片点击题已在点击时强制跳转
      if (!force && answers[current] === null && q.type !== "imgClick") {
        // 允许不选直接跳，但提示
        // 也可以强制选择，这里放宽体验
      }

      // 计分（简单：有选择就算答过）
      if (answers[current] !== null) {
        // 对特殊题不严格计分，普通题随机正确即可
        if (q.type === "choice" && answers[current] === q.correctIndex) {
          // 已经计过分就不再重复加
        }
      }

      if (current < 37) {
        current++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function goPrev() {
      if (current > 0) {
        current--;
        renderQuestion();
      }
    }

    function finishQuiz() {
      // 重新计算分数
      score = 0;
      questions.forEach((q, i) => {
        if (answers[i] !== null) {
          if (q.type === "imgClick" || q.type === "pay") {
            score += 1; // 特殊题只要点了就给分
          } else if (answers[i] === q.correctIndex) {
            score += 1;
          }
        }
      });

      quizPage.classList.add("hidden");
      resultPage.classList.remove("hidden");
      finalScore.textContent = score;
      progressBar.style.width = "100%";
      progressText.textContent = "完成";
      scoreText.textContent = `${score} / 38`;

      if (score >= 30) {
        resultMsg.textContent = "「不愧是我看中的苦工预备役。」";
      } else if (score >= 18) {
        resultMsg.textContent = "「还行，继续努力吧。」";
      } else {
        resultMsg.textContent = "「终于来了，我的苦工预备役。」";
      }
    }

    // 事件
    startBtn.onclick = () => {
      startPage.classList.add("hidden");
      quizPage.classList.remove("hidden");
      current = 0;
      answers = new Array(38).fill(null);
      score = 0;
      renderQuestion();
    };

    nextBtn.onclick = () => goNext();
    prevBtn.onclick = goPrev;

    restartBtn.onclick = () => {
      resultPage.classList.add("hidden");
      startPage.classList.remove("hidden");
      progressBar.style.width = "0%";
      progressText.textContent = "准备开始";
      scoreText.textContent = "0 / 38";
    };
  </script>
</body>
</html>
