<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>贡圈问卷 - 黑金红主题</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: #080606;
      color: #f0e6d0;
      min-height: 100vh;
      padding: 24px 16px 80px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* 页面主背景感 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(
        ellipse 80% 55% at 50% 28%,
        rgba(90, 20, 25, 0.55) 0%,
        rgba(35, 8, 10, 0.85) 40%,
        rgba(8, 3, 3, 1) 100%
      );
      z-index: -1;
      pointer-events: none;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #e8c040;
      text-shadow: 0 0 18px rgba(232, 192, 64, 0.45);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }

    .subtitle {
      text-align: center;
      font-size: 13px;
      color: #9a8060;
      margin-bottom: 28px;
    }

    /* 顶部进度栏 */
    .topbar {
      width: 100%;
      max-width: 640px;
      margin: 0 auto 24px;
      height: 48px;
      background: linear-gradient(180deg,
        rgba(28, 12, 12, 0.97) 0%,
        rgba(16, 6, 6, 0.99) 50%,
        rgba(10, 4, 4, 1) 100%
      );
      border-radius: 6px;
      border: 1px solid rgba(100, 30, 30, 0.55);
      box-shadow:
        inset 0 1px 0 rgba(160, 50, 50, 0.12),
        0 2px 10px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .progress-text {
      font-size: 14px;
      color: #e8d090;
      font-weight: 500;
    }

    .progress-bar-wrap {
      flex: 1;
      height: 8px;
      background: rgba(40, 20, 15, 0.8);
      border-radius: 4px;
      margin: 0 16px;
      overflow: hidden;
      border: 1px solid rgba(201, 162, 39, 0.25);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b1a1a, #c41e3a, #e05070);
      box-shadow: 0 0 10px rgba(196, 30, 58, 0.6);
      transition: width 0.35s ease;
      border-radius: 4px;
    }

    /* 主面板 */
    .panel {
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      border-radius: 8px;
      background: linear-gradient(160deg,
        rgba(32, 12, 12, 0.96) 0%,
        rgba(18, 6, 6, 0.98) 40%,
        rgba(10, 4, 4, 1) 100%
      );
      border: 1px solid rgba(110, 30, 30, 0.5);
      box-shadow:
        inset 0 1px 0 rgba(160, 50, 50, 0.1),
        0 4px 18px rgba(0, 0, 0, 0.4);
      padding: 28px 24px 32px;
      position: relative;
    }

    /* 分隔线 */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 360px;
      height: 20px;
      margin: 0 auto 22px;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        #8b1a1a 15%,
        #c41e3a 50%,
        #8b1a1a 85%,
        transparent 100%
      );
      box-shadow: 0 0 8px rgba(196, 30, 58, 0.55);
    }

    .divider-diamond {
      width: 14px;
      height: 14px;
      margin: 0 8px;
      background: linear-gradient(135deg, #e8c040, #c9a227);
      transform: rotate(45deg);
      box-shadow:
        0 0 12px rgba(201, 162, 39, 0.75),
        inset 0 0 4px rgba(255, 230, 150, 0.45);
      border: 1px solid #f5d060;
      position: relative;
    }

    .divider-diamond::before {
      content: '';
      position: absolute;
      inset: 3px;
      background: linear-gradient(135deg, #f5d060, #c9a227);
      box-shadow: inset 0 0 3px rgba(255, 255, 200, 0.35);
    }

    /* 题目 */
    .q-num {
      font-size: 13px;
      color: #c9a84c;
      font-weight: 500;
      margin-bottom: 10px;
      letter-spacing: 0.5px;
    }

    .q-title {
      font-size: 17px;
      font-weight: 500;
      color: #f0e6d0;
      margin-bottom: 18px;
      line-height: 1.6;
    }

    .q-title .highlight-quote {
      color: #e05070;
      text-shadow: 0 0 14px rgba(224, 80, 112, 0.45);
    }

    .q-title .highlight-name {
      color: #e8c040;
      font-weight: 500;
      text-shadow: 0 0 12px rgba(232, 192, 64, 0.4);
    }

    /* 题目图片 */
    .q-img-wrap {
      text-align: center;
      margin-bottom: 20px;
    }

    .q-img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 6px;
      border: 1px solid rgba(201, 162, 39, 0.4);
      box-shadow: 0 0 16px rgba(201, 162, 39, 0.25);
    }

    /* 选项按钮 */
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .opt-btn {
      width: 100%;
      min-height: 44px;
      padding: 12px 18px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.15),
        inset 0 1px 0 rgba(255, 220, 120, 0.06);
      text-align: left;
      font-family: inherit;
      position: relative;
      overflow: hidden;
      user-select: none;
    }

    .opt-btn:hover {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 16px rgba(201, 162, 39, 0.5),
        0 0 0 1px rgba(240, 192, 64, 0.3),
        inset 0 1px 0 rgba(255, 230, 140, 0.15);
      transform: translateY(-1px);
    }

    .opt-btn:active {
      transform: scale(0.97) translateY(1px);
      box-shadow:
        0 0 8px rgba(201, 162, 39, 0.35),
        inset 0 2px 6px rgba(0, 0, 0, 0.4);
    }

    .opt-btn.selected {
      background: linear-gradient(180deg, #3a2c18 0%, #241a0e 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 20px rgba(201, 162, 39, 0.6),
        0 0 0 1px rgba(240, 192, 64, 0.4),
        inset 0 1px 0 rgba(255, 230, 140, 0.2);
      animation: selectPulse 0.45s ease;
    }

    .opt-btn.selected::after {
      content: '✓';
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #f0c040;
      font-size: 16px;
      text-shadow: 0 0 8px rgba(240, 192, 64, 0.7);
    }

    @keyframes selectPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }

    .opt-btn.flash {
      animation: btnFlash 0.35s ease;
    }

    @keyframes btnFlash {
      0% { box-shadow: 0 0 0 0 rgba(240, 192, 64, 0.7); }
      50% { box-shadow: 0 0 24px 6px rgba(240, 192, 64, 0.45); }
      100% { box-shadow: 0 0 16px rgba(201, 162, 39, 0.5); }
    }

    .opt-btn.correct {
      border-color: #4caf50;
      box-shadow: 0 0 14px rgba(76, 175, 80, 0.45);
    }

    .opt-btn.wrong {
      border-color: #c41e3a;
      box-shadow: 0 0 14px rgba(196, 30, 58, 0.45);
      opacity: 0.75;
    }

    /* 图片选项（特殊题） */
    .img-options {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }

    .img-opt {
      width: 140px;
      height: 140px;
      border-radius: 6px;
      border: 1.5px solid #c9a227;
      background: linear-gradient(180deg, #241c12 0%, #14100a 100%);
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.18),
        inset 0 1px 0 rgba(255, 220, 120, 0.08);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
      position: relative;
    }

    .img-opt img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-opt:hover {
      border-color: #f0c040;
      box-shadow:
        0 0 18px rgba(201, 162, 39, 0.55),
        0 0 0 1px rgba(240, 192, 64, 0.35);
      transform: translateY(-2px);
    }

    .img-opt:active {
      transform: scale(0.94);
      box-shadow: 0 0 12px rgba(201, 162, 39, 0.4);
    }

    .img-opt.clicked {
      animation: selectPulse 0.4s ease;
      border-color: #f0c040;
      box-shadow: 0 0 22px rgba(201, 162, 39, 0.65);
    }

    /* 支付相关特殊展示 */
    .pay-imgs {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .pay-img {
      max-width: 180px;
      border-radius: 6px;
      border: 1px solid rgba(201, 162, 39, 0.45);
      box-shadow: 0 0 12px rgba(201, 162, 39, 0.3);
    }

    /* 导航按钮 */
    .nav-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
      flex-wrap: wrap;
    }

    .lang-btn, .game-btn {
      min-width: 100px;
      height: 40px;
      padding: 0 20px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.18),
        inset 0 1px 0 rgba(255, 220, 120, 0.08);
      font-family: inherit;
    }

    .lang-btn:hover,
    .lang-btn.active,
    .game-btn:hover,
    .game-btn.selected {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 14px rgba(201, 162, 39, 0.45),
        0 0 0 1px rgba(240, 192, 64, 0.35),
        inset 0 1px 0 rgba(255, 230, 140, 0.18);
    }

    .game-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* 结果页 */
    .result-panel {
      text-align: center;
      padding: 20px 10px;
    }

    .result-score {
      font-size: 42px;
      font-weight: 700;
      color: #e8c040;
      text-shadow: 0 0 20px rgba(232, 192, 64, 0.5);
      margin: 12px 0 8px;
    }

    .result-msg {
      font-size: 16px;
      color: #e05070;
      text-shadow: 0 0 12px rgba(224, 80, 112, 0.4);
      margin-bottom: 24px;
    }

    .hint {
      font-size: 12px;
      color: #706050;
      margin-top: 10px;
      text-align: center;
    }

    /* 开始页 */
    .start-panel {
      text-align: center;
      padding: 30px 10px;
    }

    .start-panel p {
      color: #c9a84c;
      margin-bottom: 28px;
      font-size: 15px;
    }

    /* 隐藏 */
    .hidden {
      display: none !important;
    }

    /* ========== 加载页 ========== */
    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: radial-gradient(
        ellipse 80% 55% at 50% 28%,
        rgba(90, 20, 25, 0.7) 0%,
        rgba(20, 6, 8, 0.95) 50%,
        #080606 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loadingScreen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .load-title {
      font-size: 20px;
      color: #e8c040;
      text-shadow: 0 0 16px rgba(232, 192, 64, 0.5);
      margin-bottom: 28px;
      letter-spacing: 1px;
    }

    .load-bar-wrap {
      width: 100%;
      max-width: 320px;
      height: 10px;
      background: rgba(40, 20, 15, 0.85);
      border-radius: 5px;
      border: 1px solid rgba(201, 162, 39, 0.3);
      overflow: hidden;
      margin-bottom: 14px;
    }

    .load-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b1a1a, #c41e3a, #e8c040);
      box-shadow: 0 0 12px rgba(196, 30, 58, 0.55);
      border-radius: 5px;
      transition: width 0.25s ease;
    }

    .load-text {
      font-size: 13px;
      color: #9a8060;
      margin-bottom: 8px;
    }

    .load-tip {
      font-size: 12px;
      color: #706050;
      margin-top: 18px;
      text-align: center;
      max-width: 300px;
      line-height: 1.6;
    }

    /* 免责声明 */
    .disclaimer {
      margin-top: 22px;
      padding: 14px 16px;
      background: rgba(20, 8, 8, 0.7);
      border: 1px solid rgba(100, 30, 30, 0.45);
      border-radius: 6px;
      font-size: 12px;
      color: #8a7060;
      line-height: 1.7;
      text-align: left;
    }

    .disclaimer strong {
      color: #c9a84c;
      font-weight: 500;
    }

    .disclaimer-check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-top: 14px;
      font-size: 13px;
      color: #c9a84c;
      cursor: pointer;
      user-select: none;
    }

    .disclaimer-check input {
      margin-top: 3px;
      accent-color: #c9a227;
      cursor: pointer;
    }

    /* ========== 特效系统（来自模拟上贡问卷） ========== */
    #fx-layer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 200;
      pointer-events: auto;
      overflow: hidden;
    }
    #fx-layer.show { display: block; }

    .fx-black {
      position: absolute;
      inset: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .fx-black .fx-msg {
      color: #e8c040;
      font-size: 1.2rem;
      letter-spacing: 3px;
      text-align: center;
      padding: 0 28px;
      line-height: 1.7;
      animation: fadeInScale 0.55s ease;
      text-shadow: 0 0 20px rgba(201, 162, 39, 0.7);
    }
    @keyframes fadeInScale {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .fx-rain {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, #8b1a1a 0%, #5c1010 40%, #1a0808 100%);
      overflow: hidden;
    }
    .fx-rain .rain-item {
      position: absolute;
      color: rgba(255, 230, 150, 0.9);
      font-size: 0.85rem;
      white-space: nowrap;
      animation: rainFall linear forwards;
      text-shadow: 0 0 8px rgba(0,0,0,0.4);
      pointer-events: none;
    }
    @keyframes rainFall {
      0% { transform: translateY(-40px) rotate(-8deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 0.9; }
      100% { transform: translateY(110vh) rotate(6deg); opacity: 0; }
    }

    .fx-heartbeat {
      position: absolute;
      inset: 0;
      background: rgba(8, 3, 3, 0.93);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fx-heartbeat .fx-msg {
      color: #e05070;
      font-size: 1.12rem;
      letter-spacing: 2px;
      text-align: center;
      line-height: 1.7;
      padding: 0 24px;
      animation: heartbeat 0.7s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 24px rgba(224, 80, 112, 0.85); }
    }

    .watch-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
      border-radius: 8px;
    }
    .watch-layer .watch-item {
      position: absolute;
      color: rgba(201, 162, 39, 0.28);
      font-size: 0.72rem;
      white-space: nowrap;
      animation: watchDrift 9s linear infinite;
      user-select: none;
    }
    @keyframes watchDrift {
      0% { transform: translateY(0) translateX(0); opacity: 0; }
      15% { opacity: 0.55; }
      85% { opacity: 0.35; }
      100% { transform: translateY(-130px) translateX(18px); opacity: 0; }
    }

    .panel.intense {
      border-color: rgba(196, 30, 58, 0.55);
      box-shadow: 0 0 28px rgba(196, 30, 58, 0.35), inset 0 1px 0 rgba(160, 50, 50, 0.12);
    }

    /* 移动端适配 */
    @media (max-width: 520px) {
      .panel { padding: 20px 14px 26px; }
      .q-title { font-size: 15px; }
      .opt-btn { font-size: 14px; padding: 10px 14px; }
      .img-opt { width: 110px; height: 110px; }
      .pay-img { max-width: 140px; }
    }
  </style>
</head>
<body>
  <!-- 特效层 -->
  <div id="fx-layer"></div>

  <!-- 加载页 -->
  <div id="loadingScreen">
    <div class="load-title">资源加载中</div>
    <div class="load-bar-wrap">
      <div class="load-bar" id="loadBar"></div>
    </div>
    <div class="load-text" id="loadText">0%</div>
    <div class="load-tip" id="loadTip">正在预加载图片与资源，请稍候…</div>
  </div>

  <!-- 背景音乐：暗黑氛围纯音乐（可自行替换 src 为更喜欢的纯音乐链接） -->
  <audio id="bgm" loop preload="auto">
    <source src="https://upload.wikimedia.org/wikipedia/commons/8/8b/Ambient_music_sample.ogg" type="audio/ogg">
    <source src="https://files.freemusicarchive.org/storage-freemusicarchive-org/music/ccCommunity/Kai_Engel/Idea/Kai_Engel_-_04_-_Sentinel.mp3" type="audio/mpeg">
  </audio>

  <!-- 主面板 -->
  <div class="panel" id="mainPanel" style="visibility:hidden;">
    <!-- 开始页 -->
    <div id="startPage" class="start-panel">
      <h1>贡圈问卷</h1>
      <div class="divider">
        <div class="divider-diamond"></div>
      </div>
      <div class="disclaimer">
        <strong>【免责声明】</strong><br>
        本问卷仅为虚构角色扮演与娱乐内容，所有文字、称呼与设定均属虚构创作，不针对任何真实个人或群体。<br>
        页面中出现的支付码/二维码仅为展示用途，不构成任何真实收款或交易邀请。<br>
        参与本问卷即表示您理解以上内容，并自愿以娱乐心态进行互动。作者不对任何实际支付行为负责。
      </div>
      <label class="disclaimer-check">
        <input type="checkbox" id="agreeCheck" />
        <span>我已阅读并同意以上免责声明</span>
      </label>
      <button class="game-btn" id="startBtn" style="min-width:140px;height:46px;font-size:16px;margin-top:18px;" disabled>开始</button>
      <p class="hint" style="margin-top:16px;">请先勾选同意后再开始</p>
      <button class="lang-btn" id="bgmToggle" style="margin-top:16px;min-width:130px;">开启背景音乐</button>
    </div>

    <!-- 答题页 -->
    <div id="quizPage" class="hidden">
      <div class="divider">
        <div class="divider-diamond"></div>
      </div>
      <div class="q-title" id="qTitle"></div>
      <div class="q-img-wrap hidden" id="qImgWrap">
        <img class="q-img" id="qImg" alt="" />
      </div>
      <div class="pay-imgs hidden" id="payImgs"></div>
      <div class="options" id="options"></div>
      <div class="img-options hidden" id="imgOptions"></div>
      <div class="nav-btns">
        <button class="lang-btn" id="prevBtn">上一题</button>
        <button class="game-btn selected" id="nextBtn">下一题</button>
      </div>
      <p class="hint" id="hintText">请选择一个选项后进入下一题</p>
    </div>

    <!-- 结果页 -->
    <div id="resultPage" class="hidden result-panel">
      <h1>答题完成</h1>
      <div class="divider">
        <div class="divider-diamond"></div>
      </div>
      <button class="game-btn selected" id="restartBtn" style="min-width:140px;margin-top:24px;">再玩一遍</button>
    </div>
  </div>

  <script>
    // ========== 图片映射 ==========
    const IMG_MAP = {
      1:  "https://i.postimg.cc/NfbRsC0k/1.png",
      2:  "https://i.postimg.cc/6p3nyV7f/2.png",
      3:  "https://i.postimg.cc/JznZG3yq/3.png",
      4:  "https://i.postimg.cc/t4TWYd1v/4.png",

    // 生成38题
    function buildQuestions() {
      const qs = [];

          img: IMG_MAP[i] || null,
          correctIndex: 0

          q.type = "pay";
          q.options = optionsMap[i] || ["微信", "支付宝", "都支持", "暂不需要"];
        } else if (i === 21) {
          q.type = "imgClick";
          q.options = [SPECIAL_IMG, SPECIAL_IMG, SPECIAL_IMG];
        } else if (i === 25) {
          q.type = "imgClick";
          q.options = [SPECIAL_IMG, SPECIAL_IMG];
        } else if (i === 29) {
          q.type = "imgClick";
          q.options = [SPECIAL_IMG];
        } else {
          q.type = "choice";
          q.options = optionsMap[i] ? [...optionsMap[i]] : ["继续", "好的", "下一步", "明白了"];

        qs.push(q);
      }
      return qs;

    function playFx(type, msg, duration) {
      return new Promise((resolve) => {
        const layer = document.getElementById("fx-layer");
        if (!layer) { resolve(); return; }
        layer.innerHTML = "";
        layer.classList.add("show");

        if (type === "black") {
          const div = document.createElement("div");
          div.className = "fx-black";
          div.innerHTML = '<div class="fx-msg">' + (msg || "……") + "</div>";
          layer.appendChild(div);
          setTimeout(() => { layer.classList.remove("show"); layer.innerHTML = ""; resolve(); }, duration || 2400);
        } else if (type === "heartbeat") {
          const div = document.createElement("div");
          div.className = "fx-heartbeat";
          div.innerHTML = '<div class="fx-msg">' + (msg || "……") + "</div>";
          layer.appendChild(div);
          setTimeout(() => { layer.classList.remove("show"); layer.innerHTML = ""; resolve(); }, duration || 2800);
        } else if (type === "rain") {
          const rain = document.createElement("div");
          rain.className = "fx-rain";
          layer.appendChild(rain);
          const words = ["献给小妲♥", "上贡成功", "ATM", "忠犬", "无脑吐钱", "再贡一次", "好用", "钱不是你的", "满足", "提款机", "被使用", "继续", "小妲的ATM"];
          for (let i = 0; i < 52; i++) {
            const item = document.createElement("div");
            item.className = "rain-item";
            item.textContent = words[Math.floor(Math.random() * words.length)];
            item.style.left = (Math.random() * 100) + "%";
            item.style.top = (-Math.random() * 30) + "px";
            item.style.animationDuration = (2.2 + Math.random() * 2.8) + "s";
            item.style.animationDelay = (Math.random() * 1.2) + "s";
            item.style.fontSize = (0.7 + Math.random() * 0.45) + "rem";
            item.style.opacity = 0.55 + Math.random() * 0.4;
            rain.appendChild(item);
          }
          setTimeout(() => { layer.classList.remove("show"); layer.innerHTML = ""; resolve(); }, duration || 4000);
        } else {
          layer.classList.remove("show");
          resolve();
        }
      });
    }

    function clearWatch() {
      const panel = document.getElementById("mainPanel");
      if (!panel) return;
      const old = panel.querySelector(".watch-layer");
      if (old) old.remove();
      panel.classList.remove("intense");
    }

    function spawnWatch(level) {
      clearWatch();
      const panel = document.getElementById("mainPanel");
      if (!panel || !level) return;
      panel.classList.add("intense");
      const layer = document.createElement("div");
      layer.className = "watch-layer";
      const pool = WATCH_TEXTS[level] || WATCH_TEXTS[1];
      const count = level === 1 ? 7 : (level === 2 ? 14 : 22);
      for (let i = 0; i < count; i++) {
        const item = document.createElement("span");
        item.className = "watch-item";
        item.textContent = pool[Math.floor(Math.random() * pool.length)];
        item.style.left = (Math.random() * 88) + "%";
        item.style.top = (Math.random() * 90) + "%";
        item.style.animationDelay = (Math.random() * 6) + "s";
        item.style.animationDuration = (7 + Math.random() * 5) + "s";
        item.style.fontSize = (0.65 + Math.random() * 0.25) + "rem";
        layer.appendChild(item);
      }
      panel.style.position = "relative";
      panel.appendChild(layer);
    }

    function selectOption(idx) {
      answers[current] = idx;
      const btns = optionsEl.querySelectorAll(".opt-btn");
      btns.forEach((b, i) => {
        const isSel = i === idx;
        b.classList.toggle("selected", isSel);
        if (isSel) {
          b.classList.remove("flash");
          void b.offsetWidth;
          b.classList.add("flash");
        }
      });
    }

    async function goNext(force = false) {
      const qid = current + 1; // 1-based
      const fx = FX_MAP[qid];

        // 已选过才播特效；未选也可播（叙事推进）
        await playFx(fx.type, fx.msg);
      }
      if (current < 37) {
        current++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function goPrev() {
      if (current > 0) {
        current--;
        renderQuestion();

      resultPage.classList.remove("hidden");
    }

    // 免责声明勾选
    const agreeCheck = document.getElementById("agreeCheck");
    agreeCheck.addEventListener("change", () => {
      startBtn.disabled = !agreeCheck.checked;
      if (agreeCheck.checked) {
        startBtn.classList.add("selected");
      } else {
        startBtn.classList.remove("selected");
      }
    });

    // 事件
    startBtn.onclick = () => {
      if (!agreeCheck.checked) return;
      startPage.classList.add("hidden");
      quizPage.classList.remove("hidden");
      current = 0;
      answers = new Array(38).fill(null);
      score = 0;
      renderQuestion();
    };

    nextBtn.onclick = () => goNext();
    prevBtn.onclick = goPrev;

    restartBtn.onclick = () => {
      resultPage.classList.add("hidden");
      startPage.classList.remove("hidden");
      agreeCheck.checked = false;
      startBtn.disabled = true;
      startBtn.classList.remove("selected");
    };

    // BGM 控制
    let bgmOn = false;
    bgm.volume = 0.35;
    bgmToggle.onclick = () => {
      if (bgmOn) {
        bgm.pause();
        bgmToggle.textContent = "开启背景音乐";
        bgmOn = false;
      } else {
        bgm.play().catch(() => {});
        bgmToggle.textContent = "关闭背景音乐";
        bgmOn = true;
      }
    };

    // ========== 资源预加载（强制等待全部图片） ==========
    const loadBar = document.getElementById("loadBar");
    const loadText = document.getElementById("loadText");
    const loadTip = document.getElementById("loadTip");
    const loadingScreen = document.getElementById("loadingScreen");
    const mainPanel = document.getElementById("mainPanel");

    const tips = [
      "正在预加载全部图片资源…",
      "题目图片加载中…",
      "支付码与盲盒图加载中…",
      "即将完成，请稍候…",
      "全部资源已就绪"
    ];

    function collectImageUrls() {
      const urls = new Set();
      Object.values(IMG_MAP).forEach(u => { if (u) urls.add(u); });
      urls.add(VX_IMG);
      urls.add(ZFB_IMG);
      urls.add(SPECIAL_IMG);
      return Array.from(urls);
    }

    function preloadAll() {
      const urls = collectImageUrls();
      const total = Math.max(urls.length, 1);
      let loaded = 0;
      let finished = false;

      const update = () => {
        const pct = Math.min(100, Math.round((loaded / total) * 100));
        loadBar.style.width = pct + "%";
        loadText.textContent = pct + "%";
        loadTip.textContent = tips[Math.min(Math.floor(pct / 25), tips.length - 1)];
        if (loaded >= total && !finished) {
          finished = true;
          setTimeout(finishLoading, 500);
        }
      };

      urls.forEach(url => {
        const img = new Image();
        img.onload = () => { loaded++; update(); };
        img.onerror = () => { loaded++; update(); };
        // 加时间戳避免缓存导致“假完成”
        img.src = url + (url.includes("?") ? "&" : "?") + "_t=" + Date.now();
      });

      // 超时保护 15 秒
      setTimeout(() => {
        if (!finished) {
          loaded = total;
          update();
        }
      }, 15000);
    }

    function finishLoading() {
      loadingScreen.classList.add("fade-out");
      mainPanel.style.visibility = "visible";
      setTimeout(() => {
        loadingScreen.style.display = "none";
      }, 600);
    }

    // 启动预加载
    preloadAll();
  </script>
</body>
</html>
