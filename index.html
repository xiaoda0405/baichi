<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="bingbot" content="noindex, nofollow">
  <meta name="Twitterbot" content="noindex, nofollow">
  <meta name="GPTBot" content="noindex, nofollow">
  <meta name="ChatGPT-User" content="noindex, nofollow">
  <meta name="Google-Extended" content="noindex, nofollow">
  <meta name="CCBot" content="noindex, nofollow">
  <meta name="anthropic-ai" content="noindex, nofollow">

  <meta name="GoogleOther" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>小妲的白痴贡n问卷2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      background: #050303;
      color: #f0e6d0;
      line-height: 1.5;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 90% 60% at 50% 20%, rgba(120, 15, 25, 0.45) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 80%, rgba(60, 10, 15, 0.35) 0%, transparent 50%),
        linear-gradient(180deg, #0a0404 0%, #050303 40%, #030202 100%);
      z-index: -2;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(201, 162, 39, 0.03) 0%, transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(196, 30, 58, 0.04) 0%, transparent 40%);
      z-index: -1;
      pointer-events: none;
      animation: ambientPulse 8s ease-in-out infinite alternate;
    }

    @keyframes ambientPulse {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    /* ========== 封面 ========== */
    #coverPage {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #050303;
      cursor: pointer;
      overflow: hidden;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    #coverPage.exiting {
      opacity: 0;
      transform: scale(1.08);
      pointer-events: none;
    }

    #coverPage.hidden {
      display: none !important;
    }

    .cover-bg {
      position: absolute;
      inset: 0;
      background-image: url('https://files.catbox.moe/mnxjss.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 1;
      filter: brightness(1.15) contrast(1.05) saturate(1.1);
    }

    .cover-bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(
        ellipse 85% 75% at 50% 40%,
        rgba(5, 3, 3, 0.05) 0%,
        rgba(5, 3, 3, 0.25) 50%,
        rgba(5, 3, 3, 0.55) 100%
      );
    }

    .cover-content {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 24px 20px;
      max-width: 92vw;
    }

    .cover-title {
      font-size: clamp(22px, 6.5vw, 32px);
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff8e0;
      line-height: 1.35;
      margin-bottom: 18px;
      /* 多层霓虹：白内光 + 金霓虹 + 红外光 */
      text-shadow:
        0 2px 8px rgba(0,0,0,0.85),
        0 0 4px #ffffff,
        0 0 10px #ffffff,
        0 0 18px rgba(255, 248, 220, 0.9),
        0 0 28px rgba(232, 192, 64, 0.85),
        0 0 42px rgba(201, 162, 39, 0.7),
        0 0 60px rgba(196, 30, 58, 0.55),
        0 0 80px rgba(180, 20, 40, 0.35);
      animation: titleFloat 3.2s ease-in-out infinite alternate, titleBrightness 2.8s ease-in-out infinite alternate;
    }

    @keyframes titleFloat {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    @keyframes titleBrightness {
      0% {
        filter: brightness(0.92);
        text-shadow:
          0 0 4px #ffffff,
          0 0 10px #ffffff,
          0 0 18px rgba(255, 248, 220, 0.75),
          0 0 28px rgba(232, 192, 64, 0.7),
          0 0 42px rgba(201, 162, 39, 0.55),
          0 0 60px rgba(196, 30, 58, 0.4),
          0 0 80px rgba(180, 20, 40, 0.25);
      }
      100% {
        filter: brightness(1.15);
        text-shadow:
          0 0 6px #ffffff,
          0 0 14px #ffffff,
          0 0 24px rgba(255, 248, 220, 1),
          0 0 36px rgba(232, 192, 64, 0.95),
          0 0 52px rgba(201, 162, 39, 0.85),
          0 0 72px rgba(196, 30, 58, 0.7),
          0 0 95px rgba(180, 20, 40, 0.45);
      }
    }

    .cover-line {
      width: 60%;
      max-width: 280px;
      height: 2px;
      margin: 0 auto 28px;
      border-radius: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        #ffffff 15%,
        #e8c040 40%,
        #c9a227 55%,
        #c41e3a 80%,
        transparent 100%
      );
      box-shadow:
        0 0 8px rgba(255, 255, 255, 0.6),
        0 0 16px rgba(232, 192, 64, 0.7),
        0 0 28px rgba(196, 30, 58, 0.5);
      animation: linePulse 2.4s ease-in-out infinite;
      transform-origin: center;
    }

    @keyframes linePulse {
      0% {
        width: 40%;
        opacity: 0.55;
        box-shadow:
          0 0 6px rgba(255, 255, 255, 0.4),
          0 0 12px rgba(232, 192, 64, 0.5),
          0 0 20px rgba(196, 30, 58, 0.35);
      }
      50% {
        width: 72%;
        opacity: 1;
        box-shadow:
          0 0 10px rgba(255, 255, 255, 0.8),
          0 0 22px rgba(232, 192, 64, 0.9),
          0 0 36px rgba(196, 30, 58, 0.65);
      }
      100% {
        width: 40%;
        opacity: 0.55;
        box-shadow:
          0 0 6px rgba(255, 255, 255, 0.4),
          0 0 12px rgba(232, 192, 64, 0.5),
          0 0 20px rgba(196, 30, 58, 0.35);
      }
    }

    .cover-enter {
      font-size: clamp(14px, 4vw, 17px);
      font-weight: 500;
      letter-spacing: 3px;
      color: #f0c060;
      margin-top: 8px;
      text-shadow:
        0 0 8px rgba(232, 192, 64, 0.8),
        0 0 18px rgba(196, 30, 58, 0.5),
        0 0 28px rgba(201, 162, 39, 0.4);
      animation: enterBreathe 2.2s ease-in-out infinite;
    }

    @keyframes enterBreathe {
      0%, 100% {
        opacity: 0.55;
        transform: scale(0.96);
        text-shadow:
          0 0 6px rgba(232, 192, 64, 0.5),
          0 0 12px rgba(196, 30, 58, 0.35);
      }
      50% {
        opacity: 1;
        transform: scale(1.04);
        text-shadow:
          0 0 10px rgba(232, 192, 64, 0.95),
          0 0 22px rgba(196, 30, 58, 0.7),
          0 0 36px rgba(201, 162, 39, 0.45);
      }
    }

    /* ========== 加载页 ========== */
    #loadingScreen {
      position: fixed;
      inset: 0;
      z-index: 10001;
      background: radial-gradient(
        ellipse 80% 55% at 50% 28%,
        rgba(90, 20, 25, 0.7) 0%,
        rgba(20, 6, 8, 0.95) 50%,
        #050303 100%
      );
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #loadingScreen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .load-title {
      font-size: 18px;
      color: #e8c040;
      text-shadow: 0 0 16px rgba(232, 192, 64, 0.5);
      margin-bottom: 24px;
      letter-spacing: 2px;
    }

    .load-bar-wrap {
      width: 100%;
      max-width: 280px;
      height: 8px;
      background: rgba(40, 20, 15, 0.85);
      border-radius: 4px;
      border: 1px solid rgba(201, 162, 39, 0.35);
      overflow: hidden;
      margin-bottom: 12px;
    }

    .load-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8b1a1a, #c41e3a, #e8c040);
      box-shadow: 0 0 12px rgba(196, 30, 58, 0.55);
      border-radius: 4px;
      transition: width 0.25s ease;
    }

    .load-text {
      font-size: 13px;
      color: #9a8060;
    }

    .load-tip {
      font-size: 12px;
      color: #706050;
      margin-top: 16px;
      text-align: center;
      max-width: 280px;
    }

    /* ========== 主容器：严格适配视口，禁止滚动 ========== */
    .app-shell {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      visibility: visible;
      overflow: hidden;
    }

    .panel {
      width: 100%;
      max-width: 100%;
      height: 100%;
      max-height: 100%;
      border-radius: 0;
      background: linear-gradient(165deg,
        rgba(28, 10, 12, 0.97) 0%,
        rgba(16, 6, 8, 0.98) 45%,
        rgba(8, 3, 4, 1) 100%
      );
      /* 大边框：金红双层描边 + 外发光，避免全屏像 bug */
      border: 3px solid #c9a227;
      box-shadow:
        inset 0 0 0 1px rgba(232, 192, 64, 0.45),
        inset 0 0 0 4px rgba(20, 8, 8, 0.9),
        inset 0 0 0 6px rgba(196, 30, 58, 0.55),
        inset 0 0 28px rgba(120, 20, 30, 0.25),
        0 0 0 1px rgba(180, 40, 50, 0.5),
        0 0 24px rgba(201, 162, 39, 0.35),
        0 0 48px rgba(196, 30, 58, 0.2);
      padding: 18px 20px 20px;
      padding-top: max(18px, env(safe-area-inset-top));
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    .panel.intense {
      border-color: #e05070;
      box-shadow:
        inset 0 0 0 1px rgba(232, 192, 64, 0.5),
        inset 0 0 0 4px rgba(20, 8, 8, 0.9),
        inset 0 0 0 6px rgba(224, 80, 112, 0.65),
        inset 0 0 32px rgba(196, 30, 58, 0.3),
        0 0 0 1px rgba(196, 30, 58, 0.6),
        0 0 28px rgba(196, 30, 58, 0.45),
        0 0 56px rgba(201, 162, 39, 0.25);
    }

    /* 顶部装饰条 */
    .panel-top-accent {
      position: absolute;
      top: 3px;
      left: 8%;
      right: 8%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent,
        rgba(232, 192, 64, 0.65) 15%,
        rgba(196, 30, 58, 0.85) 50%,
        rgba(232, 192, 64, 0.65) 85%,
        transparent
      );
      box-shadow: 0 0 12px rgba(196, 30, 58, 0.5);
      z-index: 2;
      pointer-events: none;
    }

    /* 分隔线 */
    .divider {
      display: flex;
      align-items: center;
      width: 100%;
      max-width: 240px;
      height: 16px;
      margin: 0 auto 12px;
      flex-shrink: 0;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        #8b1a1a 20%,
        #c41e3a 50%,
        #8b1a1a 80%,
        transparent 100%
      );
      box-shadow: 0 0 6px rgba(196, 30, 58, 0.5);
    }

    .divider-diamond {
      width: 10px;
      height: 10px;
      margin: 0 6px;
      background: linear-gradient(135deg, #e8c040, #c9a227);
      transform: rotate(45deg);
      box-shadow:
        0 0 10px rgba(201, 162, 39, 0.7),
        inset 0 0 3px rgba(255, 230, 150, 0.4);
      border: 1px solid #f5d060;
      flex-shrink: 0;
    }

    /* 开始页 */
    .start-panel {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      padding: 4px 0;
    }

    .start-panel h1 {
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 700;
      color: #e8c040;
      text-shadow: 0 0 16px rgba(232, 192, 64, 0.45);
      margin-bottom: 6px;
      letter-spacing: 1px;
      flex-shrink: 0;
    }

    .disclaimer {
      margin: 8px 0;
      padding: 10px 12px;
      background: rgba(18, 6, 8, 0.75);
      border: 1px solid rgba(100, 30, 30, 0.4);
      border-radius: 6px;
      font-size: 11px;
      color: #8a7060;
      line-height: 1.65;
      text-align: left;
      flex-shrink: 0;
      max-height: 28vh;
      overflow: hidden;
    }

    .disclaimer strong {
      color: #c9a84c;
      font-weight: 500;
    }

    .game-btn {
      min-width: 120px;
      height: 42px;
      padding: 0 22px;
      background: linear-gradient(180deg, #2a1c10 0%, #161008 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.2),
        0 0 12px rgba(201, 162, 39, 0.15),
        inset 0 1px 0 rgba(255, 220, 120, 0.1);
      font-family: inherit;
      margin-top: 12px;
      flex-shrink: 0;
    }

    .game-btn:hover,
    .game-btn.selected {
      background: linear-gradient(180deg, #3a2818 0%, #22180c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 18px rgba(201, 162, 39, 0.5),
        0 0 0 1px rgba(240, 192, 64, 0.35),
        inset 0 1px 0 rgba(255, 230, 140, 0.2);
    }

    .game-btn:active {
      transform: scale(0.96);
    }

    /* 其它作品链接 */
    .works-links {
      margin-top: 14px;
      padding: 10px 12px;
      background: rgba(12, 5, 6, 0.6);
      border: 1px solid rgba(90, 30, 30, 0.35);
      border-radius: 6px;
      width: 100%;
      flex-shrink: 0;
    }

    .works-title {
      font-size: 11px;
      color: #9a8060;
      margin-bottom: 6px;
      letter-spacing: 1px;
    }

    .works-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .works-list a {
      font-size: 12px;
      color: #e8c040;
      text-decoration: none;
      padding: 4px 0;
      transition: all 0.2s ease;
      text-shadow: 0 0 8px rgba(232, 192, 64, 0.3);
    }

    .works-list a:hover {
      color: #ffe9a0;
      text-shadow: 0 0 12px rgba(232, 192, 64, 0.6);
    }

    /* 答题页 */
    #quizPage {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #quizPage.hidden {
      display: none !important;
    }

    .q-title {
      font-size: clamp(14px, 4.2vw, 17px);
      font-weight: 500;
      color: #f0e6d0;
      margin-bottom: 12px;
      line-height: 1.55;
      flex-shrink: 0;
      max-height: 24vh;
      overflow: hidden;
    }

    .q-img-wrap {
      text-align: center;
      margin-bottom: 10px;
      flex-shrink: 1;
      min-height: 0;
      max-height: 38vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .q-img-wrap.hidden {
      display: none !important;
    }

    .q-img {
      max-width: 100%;
      max-height: 36vh;
      width: auto;
      height: auto;
      border-radius: 6px;
      border: 1px solid rgba(201, 162, 39, 0.35);
      box-shadow: 0 0 14px rgba(201, 162, 39, 0.2);
      object-fit: contain;
    }

    .pay-imgs {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 10px;
      flex-shrink: 1;
      min-height: 0;
      max-height: 28vh;
    }

    .pay-imgs.hidden {
      display: none !important;
    }

    .pay-img {
      max-width: 160px;
      max-height: 26vh;
      border-radius: 5px;
      border: 1px solid rgba(201, 162, 39, 0.4);
      box-shadow: 0 0 10px rgba(201, 162, 39, 0.25);
      object-fit: contain;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .options.hidden {
      display: none !important;
    }

    .opt-btn {
      width: 100%;
      min-height: 44px;
      padding: 11px 16px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.18s ease;
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.12),
        inset 0 1px 0 rgba(255, 220, 120, 0.05);
      text-align: left;
      font-family: inherit;
      position: relative;
      overflow: hidden;
      user-select: none;
      flex-shrink: 0;
    }

    .opt-btn:hover {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 14px rgba(201, 162, 39, 0.45),
        0 0 0 1px rgba(240, 192, 64, 0.25),
        inset 0 1px 0 rgba(255, 230, 140, 0.12);
    }

    .opt-btn:active {
      transform: scale(0.97);
    }

    .opt-btn.selected {
      background: linear-gradient(180deg, #3a2c18 0%, #241a0e 100%);
      border-color: #f0c040;
      color: #ffe9a0;
      box-shadow:
        0 0 18px rgba(201, 162, 39, 0.55),
        0 0 0 1px rgba(240, 192, 64, 0.35),
        inset 0 1px 0 rgba(255, 230, 140, 0.18);
      animation: selectPulse 0.4s ease;
    }

    .opt-btn.selected::after {
      content: '✓';
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #f0c040;
      font-size: 14px;
      text-shadow: 0 0 8px rgba(240, 192, 64, 0.7);
    }

    @keyframes selectPulse {
      0% { transform: scale(1); }
      40% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .opt-btn.flash {
      animation: btnFlash 0.3s ease;
    }

    @keyframes btnFlash {
      0% { box-shadow: 0 0 0 0 rgba(240, 192, 64, 0.6); }
      50% { box-shadow: 0 0 20px 4px rgba(240, 192, 64, 0.4); }
      100% { box-shadow: 0 0 14px rgba(201, 162, 39, 0.45); }
    }

    .image-option-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      overflow: hidden;
    }

    .image-option-btn img {
      max-width: 100%;
      max-height: 100px;
      border-radius: 8px;
      object-fit: contain;
    }

    .img-options {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      flex-shrink: 0;
    }

    .img-options.hidden {
      display: none !important;
    }

    .img-opt {
      width: 120px;
      height: 120px;
      border-radius: 6px;
      border: 1.5px solid #c9a227;
      background: linear-gradient(180deg, #241c12 0%, #14100a 100%);
      box-shadow:
        0 0 0 1px rgba(201, 162, 39, 0.15),
        inset 0 1px 0 rgba(255, 220, 120, 0.06);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s ease;
      position: relative;
      flex-shrink: 0;
    }

    .img-opt img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .img-opt:hover {
      border-color: #f0c040;
      box-shadow: 0 0 16px rgba(201, 162, 39, 0.5);
      transform: translateY(-2px);
    }

    .img-opt:active {
      transform: scale(0.94);
    }

    .img-opt.clicked {
      animation: selectPulse 0.35s ease;
      border-color: #f0c040;
      box-shadow: 0 0 20px rgba(201, 162, 39, 0.6);
    }

    .nav-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 10px;
      flex-shrink: 0;
    }

    .lang-btn {
      min-width: 80px;
      height: 34px;
      padding: 0 14px;
      background: linear-gradient(180deg, #1f1810 0%, #120e08 100%);
      border: 1px solid #c9a227;
      border-radius: 4px;
      color: #e8d090;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 0 1px rgba(201, 162, 39, 0.15);
      font-family: inherit;
    }

    .lang-btn:hover {
      background: linear-gradient(180deg, #2e2414 0%, #1c160c 100%);
      border-color: #f0c040;
      color: #ffe9a0;
    }

    .lang-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      pointer-events: none;

    function playFx(type, msg, duration) {
      return new Promise((resolve) => {
        const layer = document.getElementById("fx-layer");
        if (!layer) { resolve(); return; }
        layer.innerHTML = "";
        layer.classList.add("show");

        if (type === "black") {
          const div = document.createElement("div");
          div.className = "fx-black";
          div.innerHTML = '<div class="fx-msg">' + (msg || "……") + "</div>";
          layer.appendChild(div);
          setTimeout(() => { layer.classList.remove("show"); layer.innerHTML = ""; resolve(); }, duration || 2400);
        } else if (type === "heartbeat") {
          const div = document.createElement("div");
          div.className = "fx-heartbeat";
          div.innerHTML = '<div class="fx-msg">' + (msg || "……") + "</div>";
          layer.appendChild(div);
          setTimeout(() => { layer.classList.remove("show"); layer.innerHTML = ""; resolve(); }, duration || 2800);
        } else if (type === "rain") {
          const rain = document.createElement("div");
          rain.className = "fx-rain";
          layer.appendChild(rain);
          const words = RAIN_TEXTS.length ? RAIN_TEXTS : ["献给小妲♥"];
          for (let i = 0; i < 52; i++) {
            const item = document.createElement("div");
            item.className = "rain-item";
            item.textContent = words[Math.floor(Math.random() * words.length)];
            item.style.left = (Math.random() * 100) + "%";
            item.style.top = (-Math.random() * 30) + "px";
            item.style.animationDuration = (2.2 + Math.random() * 2.8) + "s";
            item.style.animationDelay = (Math.random() * 1.2) + "s";
            item.style.fontSize = (0.7 + Math.random() * 0.45) + "rem";
            item.style.opacity = 0.55 + Math.random() * 0.4;
            rain.appendChild(item);
          }
          setTimeout(() => { layer.classList.remove("show"); layer.innerHTML = ""; resolve(); }, duration || 4000);
        } else {
          layer.classList.remove("show");
          resolve();
        }
      });
    }

    function clearWatch() {
      const old = mainPanel.querySelector(".watch-layer");
      if (old) old.remove();
      mainPanel.classList.remove("intense");
    }

    function spawnWatch(level) {
      clearWatch();
      if (!level) return;
      mainPanel.classList.add("intense");
      const layer = document.createElement("div");
      layer.className = "watch-layer";
      const pool = WATCH_TEXTS[level] || WATCH_TEXTS[1];
      const count = level === 1 ? 7 : (level === 2 ? 14 : 22);
      for (let i = 0; i < count; i++) {
        const item = document.createElement("span");
        item.className = "watch-item";
        item.textContent = pool[Math.floor(Math.random() * pool.length)];
        item.style.left = (Math.random() * 88) + "%";
        item.style.top = (Math.random() * 90) + "%";
        item.style.animationDelay = (Math.random() * 6) + "s";
        item.style.animationDuration = (7 + Math.random() * 5) + "s";
        item.style.fontSize = (0.65 + Math.random() * 0.25) + "rem";
        layer.appendChild(item);
      }
      mainPanel.appendChild(layer);
    }

    function getOption(opt) {
      if (opt && typeof opt === "object") {
        if (opt.type === "image") return { type: "image", value: opt.url || "" };
        return { type: "text", value: opt.text ?? opt.value ?? "" };
      }
      return { type: /^https?:\/\//i.test(String(opt || "")) ? "image" : "text", value: String(opt ?? "") };
    }

    function renderQuestion() {
      const q = questions[current];
      qTitle.innerHTML = (q.title || '').replace(/\n/g, '<br>');

      qImgWrap.classList.add("hidden");
      qImg.removeAttribute("src");
      payImgs.classList.add("hidden");
      payImgs.innerHTML = "";
      optionsEl.innerHTML = "";
      optionsEl.classList.remove("hidden");
      imgOptions.classList.add("hidden");
      imgOptions.innerHTML = "";

      if (q.img && q.type !== "imgClick") {
        qImg.src = q.img;
        qImgWrap.classList.remove("hidden");
      }

      if (q.type === "pay") {
        const pay = Array.isArray(q.payImages) && q.payImages.length ? q.payImages : [VX_IMG, ZFB_IMG];
        pay.filter(Boolean).forEach((url, idx) => {
          const img = document.createElement("img");
          img.className = "pay-img";
          img.src = url;
          img.alt = idx === 0 ? "微信" : "支付宝";
          payImgs.appendChild(img);
        });
        payImgs.classList.remove("hidden");
        hintText.textContent = "仅展示支付码，点击选项即可进入下一题";
        q.options.forEach((raw, idx) => {
          const opt = getOption(raw);
          const btn = document.createElement("button");
          btn.className = "opt-btn" + (answers[current] === idx ? " selected" : "");
          btn.textContent = opt.value;
          btn.onclick = () => selectOption(idx);
          optionsEl.appendChild(btn);
        });
      } else if (q.type === "imgClick") {
        optionsEl.classList.add("hidden");
        imgOptions.classList.remove("hidden");
        hintText.textContent = "点击任意图片即可进入下一题";
        q.options.forEach((raw, idx) => {
          const opt = getOption(raw);
          const div = document.createElement("div");
          div.className = "img-opt";
          div.innerHTML = '<img src="' + opt.value + '" alt="选项' + (idx + 1) + '" />';
          div.onclick = () => {
            if (isAdvancing) return;
            isAdvancing = true;
            answers[current] = idx;
            div.classList.add("clicked");
            imgOptions.querySelectorAll(".img-opt").forEach(el => { el.style.pointerEvents = "none"; });
            setTimeout(() => {
              goNext(true).finally(() => { isAdvancing = false; });
            }, 280);
          };
          imgOptions.appendChild(div);
        });
      } else {
        hintText.textContent = "点击选项即可进入下一题";
        q.options.forEach((raw, idx) => {
          const opt = getOption(raw);
          const btn = document.createElement("button");

          btn.textContent = opt.value;
          btn.onclick = () => selectOption(idx);
          optionsEl.appendChild(btn);
        });
      }

      prevBtn.disabled = current === 0;

      btns.forEach((b, i) => {
        const isSel = i === idx;
        b.classList.toggle("selected", isSel);
        b.style.pointerEvents = "none";
        if (isSel) {
          b.classList.remove("flash");
          void b.offsetWidth;
          b.classList.add("flash");
        }
      });
      setTimeout(() => {
        goNext(false).finally(() => { isAdvancing = false; });
      }, 320);
    }

    async function goNext(force) {
      const qid = current + 1;
      const fx = FX_MAP[qid];
      if (fx && !force) {
        await playFx(fx.type, fx.msg, fx.duration);
      }
      if (current < questions.length - 1) {
        current++;
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function goPrev() {
      if (current > 0) {
        isAdvancing = false;
        current--;
        renderQuestion();
      }
    }

    function finishQuiz() {
      quizPage.classList.add("hidden");
      resultPage.classList.remove("hidden");
      clearWatch();
    }

    // 封面点击进入
    coverPage.addEventListener("click", () => {
      coverPage.classList.add("exiting");
      setTimeout(() => {
        coverPage.classList.add("hidden");
        coverPage.classList.remove("exiting");
      }, 450);
    });

    startBtn.onclick = () => {
      startPage.classList.add("hidden");
      quizPage.classList.remove("hidden");
      current = 0;
      answers = new Array(questions.length).fill(null);
      renderQuestion();
      bgm.volume = 0.28;
      bgm.play().catch(() => {});
    };

    prevBtn.onclick = goPrev;

    restartBtn.onclick = () => {
      resultPage.classList.add("hidden");
      startPage.classList.remove("hidden");
      bgm.pause();
      bgm.currentTime = 0;
      clearWatch();
    };

    // 预加载

    // ========== 资源预加载（并行 + 失败重试 + 进度条，同引导训练问卷） ==========
    const loadBar = document.getElementById("loadBar");
    const loadText = document.getElementById("loadText");
    const loadTip = document.getElementById("loadTip");
    const loadingScreen = document.getElementById("loadingScreen");

    const tips = [
      "正在预加载全部图片资源…",
      "题目图片加载中…",
      "支付码与盲盒图加载中…",
      "即将完成，请稍候…",
      "全部资源已就绪"
    ];

    function collectImageUrls() {
      const urls = new Set();
      Object.values(IMG_MAP).forEach(u => { if (u) urls.add(u); });
      urls.add(VX_IMG);
      urls.add(ZFB_IMG);
      urls.add(SPECIAL_IMG);
      urls.add("https://files.catbox.moe/mnxjss.png");
      questions.forEach(q => {
        if (q.img) urls.add(q.img);
        (q.payImages || []).forEach(u => { if (u) urls.add(u); });
        (q.options || []).forEach(opt => {
          if (opt && typeof opt === "object" && opt.type === "image" && opt.url) urls.add(opt.url);
          else if (typeof opt === "string" && /^https?:\/\//i.test(opt)) urls.add(opt);
        });
      });
      // 背景音乐也预加载
      return {
        imgs: Array.from(urls),
        audio: "https://files.catbox.moe/5plhe0.mp3"
      };
    }

    function preloadAll() {
      const collected = collectImageUrls();
      const assets = collected.imgs.map(url => ({ type: "img", url: url }));
      assets.push({ type: "audio", url: collected.audio, target: "bgm" });

      return new Promise(function(resolve) {
        let loaded = 0, finished = false;
        const total = Math.max(assets.length, 1);

        function progress() {
          loaded++;
          const pct = Math.min(100, Math.round((loaded / total) * 100));
          if (loadBar) loadBar.style.width = pct + "%";
          if (loadText) loadText.textContent = pct + "%";
          if (loadTip) loadTip.textContent = tips[Math.min(Math.floor(pct / 25), tips.length - 1)];
          if (loaded >= total && !finished) {
            finished = true;
            if (loadBar) loadBar.style.width = "100%";
            if (loadText) loadText.textContent = "100%";
            resolve();
          }
        }

        function loadMediaFallback(item, done) {
          const media = document.createElement(item.type === "video" ? "video" : "audio");
          media.preload = "auto";
          media.muted = true;
          media.playsInline = true;
          let settled = false, checkTimer = null, stallTimer = null;

          function cleanup() {
            if (checkTimer) clearInterval(checkTimer);
            if (stallTimer) clearTimeout(stallTimer);
            media.removeAttribute("src");
            try { media.load(); } catch (_) {}
          }
          function finish() {
            if (settled) return;
            settled = true;
            cleanup();
            const target = document.getElementById(item.target);
            if (target) {
              target.src = item.url;
              target.preload = "auto";
              try { target.load(); } catch (_) {}
            }
            done();
          }
          function fail() {
            if (settled) return;
            settled = true;
            cleanup();
            done();
          }
          function check() {
            if (settled) return;
            if (media.readyState >= 3) {
              finish();
            }
          }

          media.addEventListener("loadedmetadata", check);
          media.addEventListener("canplaythrough", check);
          media.addEventListener("error", fail, { once: true });
          media.src = item.url;
          try { media.load(); } catch (_) {}
          checkTimer = setInterval(check, 500);
          stallTimer = setTimeout(function() { if (!settled) fail(); }, 45000);
        }

        function loadItem(item) {
          let attempt = 0, completed = false, retryTimer = null;

          function complete() {
            if (completed || finished) return;
            completed = true;
            if (retryTimer) clearTimeout(retryTimer);
            progress();
          }

          function retry() {
            if (completed || finished) return;
            attempt++;
            const wait = Math.min(8000, 800 * Math.pow(2, Math.min(attempt - 1, 3)));
            retryTimer = setTimeout(start, wait);
          }

          function start() {
            if (completed || finished) return;

            if (item.type === "img") {
              const img = new Image();
              let settled = false;
              img.onload = function() {
                if (settled) return;
                settled = true;
                complete();
              };
              img.onerror = function() {
                if (settled) return;
                settled = true;
                retry();
              };
              img.src = item.url;
              return;
            }

            // audio / video: fetch blob first, fallback to media element
            const controller = new AbortController();
            const timeout = setTimeout(function() { controller.abort(); }, 30000);

            fetch(item.url, {
              method: "GET",
              cache: "force-cache",
              mode: "cors",
              signal: controller.signal
            }).then(function(response) {
              if (!response.ok) throw new Error("HTTP " + response.status);
              return response.blob();
            }).then(function(blob) {
              clearTimeout(timeout);
              if (!blob || !blob.size) throw new Error("empty media");
              const blobUrl = URL.createObjectURL(blob);
              const target = document.getElementById(item.target);
              if (target) {
                target.src = blobUrl;
                target.preload = "auto";
                try { target.load(); } catch (_) {}
              }
              complete();
            }).catch(function() {
              clearTimeout(timeout);
              loadMediaFallback(item, complete);
            });
          }

          start();
        }

        assets.forEach(loadItem);
      });
    }

    function finishLoading() {
      loadingScreen.classList.add("fade-out");
      setTimeout(() => {
        loadingScreen.style.display = "none";
      }, 550);
    }

    // 启动：预加载完成后再关加载层；封面默认已可见
    preloadAll().then(function() {
      finishLoading();
    });

    // 兜底：最多 3 秒强制关闭加载层，防止白屏
    setTimeout(function() {
      try {
        var ls = document.getElementById("loadingScreen");
        if (ls && ls.style.display !== "none") {
          ls.classList.add("fade-out");
          setTimeout(function(){ ls.style.display = "none"; }, 400);
        }
        var cp = document.getElementById("coverPage");
        if (cp) cp.classList.remove("hidden");
      } catch (e) {}
    }, 3000);

  </script>

<script>
  // 不拦截 copy / cut / paste / contextmenu，让浏览器保持默认行为。
  document.addEventListener('copy', function () {}, false);
  document.addEventListener('cut', function () {}, false);
  document.addEventListener('paste', function () {}, false);
</script>

<script>
(function () {
  "use strict";

  function block(e) {
    e.preventDefault();
    e.stopPropagation();
    return false;
  }

  document.addEventListener("contextmenu", block, true);
  document.addEventListener("copy", block, true);
  document.addEventListener("cut", block, true);
  document.addEventListener("dragstart", block, true);
  document.addEventListener("selectstart", block, true);

  // 手机端长按、拖选等常见选择行为
  document.addEventListener("touchstart", function (e) {
    if (e.target.closest("input, textarea, [contenteditable='true']")) return;
  }, {capture:true, passive:true});

  // 清空剪贴板写入事件，降低通过网页按钮/快捷操作复制的可能性
  document.addEventListener("beforecopy", block, true);
})();
</script>

</body>
